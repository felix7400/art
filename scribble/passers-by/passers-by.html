<title>Passers-by · scribble</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2622; }
  body { display: grid; place-items: center; }

<canvas id="art" role="img" aria-label="A pen sketch on cream paper: a street lamp on a rainy night. People with umbrellas walk through its pool of light on the wet pavement and dissolve into the scribbled dark."></canvas>
<script>
// same seed, same picture. t = where the loop starts (seconds, 0 to 8)
var params = { seed: 7, t: 2.5625 };
new URLSearchParams(location.search).forEach((v, k) => { if (k in params) params[k] = +v; });
</script>
<script>
/* scribble.js — drawing library for the style "Scribble Sketch" (Canvas 2D, no dependencies).
 *
 * A quick pen sketch in a sketchbook: one warm black ink on cream paper. Tone is never filled, it is
 * scribbled: small zigzag patches whose spacing gives the value, and whose direction gives the material
 * (sky diagonal, walls upright, wet street lying flat). Light is the paper that was left blank. Figures
 * are dense zigzag scribbles with loose, overshooting edges, so they read as people from far and
 * dissolve when you look closer. Towards the edges of the picture the drawing simply stops.
 *
 * All randomness runs through seeded generators (SK.rng, SK.hash, SK.noise); nothing depends on time
 * or Math.random, so every frame of an animation can be redrawn alone.
 *
 * Main API (x right, y down, units px):
 *   SK.palette                          colour tokens
 *   SK.rng(seed) · SK.hash(...n) · SK.noise(x, y, seed) · SK.fbm(x, y, seed)
 *   SK.canvas(w, h)                     offscreen canvas
 *   SK.paper(ctx, w, h, seed)           cream paper with grain and a few fibres
 *   SK.pen(ctx, pts, w, o)              one tapered pen stroke through points (Catmull-Rom)
 *   SK.line(ctx, a, b, w, r, o)         a loose straight line: 1–3 passes, overshoot, slight bow
 *   SK.zigzag(ctx, x, y, ang, len, wid, sp, lw, r)   one scribble patch (the unit of tone)
 *   SK.hatch(ctx, o)                    a tonal field of patches from a darkness function
 *   SK.fill(ctx, poly, o)               scribble-fill a polygon (back and forth, loose edges)
 *   SK.squiggle(ctx, x0, x1, y, o, r)   a flat wavy stroke (reflections on a wet street)
 *   SK.wash(ctx, x, y, r, a, o)         the warm lamplight wash (the only colour)
 *   SK.lampGeo(x, by, gy, s) · SK.lamp(ctx, L, seed)  the street lamp
 *   SK.walker(o, t) · SK.figure(ctx, F, o)            a passer-by: pose at time t, drawn as a scribble
 */
(function (G) {
  'use strict';
  const SK = {};

  // ---------- tokens ----------
  SK.palette = {
    paper: '#EDE4D0',      // cream sketchbook paper
    paperLight: '#F4EDDD', // paper in the light, rain lit from behind
    ink: '#1E1A16',        // warm black ink, the only drawing colour
    inkSoft: 'rgba(30,26,22,0.55)',
    wash: '#E9BE62',       // the lamplight: a thin ochre wash, never more than 50 %
    washDeep: '#D9A24A',
    grain: '#CFC3A8',      // paper fibres
  };
  const P = SK.palette;

  // ---------- randomness ----------
  SK.rng = (seed) => {
    let a = seed >>> 0;
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  /** Stateless hash of integers → 0..1 */
  SK.hash = (...n) => {
    let h = 2166136261 >>> 0;
    for (const v of n) { h ^= (v | 0) + 0x9e3779b9 + (h << 6) + (h >>> 2); h = Math.imul(h, 16777619) >>> 0; }
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d) >>> 0; h ^= h >>> 12; h = Math.imul(h, 0x297a2d39) >>> 0; h ^= h >>> 15;
    return (h >>> 0) / 4294967296;
  };
  const sm = (t) => t * t * (3 - 2 * t);
  /** Smooth value noise 0..1 */
  SK.noise = (x, y, seed = 0) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = SK.hash(xi, yi, seed), b = SK.hash(xi + 1, yi, seed), c = SK.hash(xi, yi + 1, seed), d = SK.hash(xi + 1, yi + 1, seed);
    const u = sm(xf), v = sm(yf);

  };
  SK.fbm = (x, y, seed = 0) => 0.55 * SK.noise(x, y, seed) + 0.3 * SK.noise(x * 2.1, y * 2.1, seed + 7) + 0.15 * SK.noise(x * 4.3, y * 4.3, seed + 13);
  SK.clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  SK.smooth = (a, b, x) => { const t = SK.clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  SK.lerp = (a, b, t) => a + (b - a) * t;
  SK.canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  // ---------- paper ----------
  /** Cream paper: flat colour, fine grain, a few fibres, very slightly darker towards the edges. */
  SK.paper = (ctx, w, h, seed = 1) => {
    ctx.save();
    ctx.fillStyle = P.paper; ctx.fillRect(0, 0, w, h);

      const ex = Math.min(x, cw - 1 - x) / cw, ey = Math.min(y, ch - 1 - y) / ch;
      const edge = (1 - SK.smooth(0, 0.12, Math.min(ex, ey))) * 7;

  // ---------- pen ----------
  /** Catmull-Rom resampling of an open polyline (seg points per span). */
  SK.spline = (pts, seg = 6) => {
    const n = pts.length; if (n < 3) {

                0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
      }
    }
    o.push(pts[n - 1].slice(0, 2));
    return o;
  };

  /** One pen stroke: a filled polygon around the spline, tapered at both ends, pressure wobbling along it.
   *  o: { col, alpha, t0, t1 (taper fractions), min (thinnest, x w), seed, seg } */
  SK.pen = (ctx, pts, w, o = {}) => {
    const sp = SK.spline(pts, o.seg ?? 6), n = sp.length; if (n < 2) return;
    const L = [], R = [], seed = o.seed ?? 3, t0 = o.t0 ?? 0.18, t1 = o.t1 ?? 0.3, mn = o.min ?? 0.3;
    let len = 0; const cum = [0];
    for (let i = 1; i < n; i++) { len += Math.hypot(sp[i][0] - sp[i - 1][0], sp[i][1] - sp[i - 1][1]); cum.push(len); }
    for (let i = 0; i < n; i++) {
      const a = sp[Math.max(0, i - 1)], b = sp[Math.min(n - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      const u = len ? cum[i] / len : 0;
      const prof = Math.min(1, t0 ? u / t0 : 1, t1 ? (1 - u) / t1 : 1);
      const pr = 0.8 + 0.4 * SK.noise(cum[i] / 40, 0.5, seed);
      const hw = (w / 2) * (mn + (1 - mn) * sm(SK.clamp(prof))) * pr;
      L.push([sp[i][0] - dy * hw, sp[i][1] + dx * hw]); R.push([sp[i][0] + dy * hw, sp[i][1] - dx * hw]);
    }
    ctx.save();
    ctx.fillStyle = o.col || P.ink; ctx.globalAlpha *= o.alpha ?? 1;
    ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  };

  /** A loose straight line from a to b: passes (1–3) that miss each other a little, overshoot at the ends, slight bow.
   *  o: { passes, over, bow, col, alpha, jit } */
  SK.line = (ctx, a, b, w, r, o = {}) => {
    const passes = o.passes ?? 2, over = o.over ?? 6, bow = o.bow ?? 0.012, jit = o.jit ?? 1.6;
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l, nx = -uy, ny = ux;
    for (let p = 0; p < passes; p++) {
      const e0 = (r() - 0.35) * over, e1 = (r() - 0.35) * over, off = (r() - 0.5) * jit * 2, bw = (r() - 0.5) * 2 * bow * l;
      const A = [a[0] - ux * e0 + nx * off, a[1] - uy * e0 + ny * off], B = [b[0] + ux * e1 + nx * (off + (r() - 0.5) * jit), b[1] + uy * e1 + ny * (off + (r() - 0.5) * jit)];
      const M = [(A[0] + B[0]) / 2 + nx * bw, (A[1] + B[1]) / 2 + ny * bw];
      SK.pen(ctx, [A, M, B], w * (p ? 0.75 : 1) * (0.85 + r() * 0.3), { col: o.col, alpha: (o.alpha ?? 1) * (p ? 0.8 : 1), seed: (r() * 1e6) | 0, t0: 0.08, t1: 0.25, min: 0.35 });
    }
  };

  /** A loose path through points (several passes). */
  SK.path = (ctx, pts, w, r, o = {}) => {
    const passes = o.passes ?? 2, jit = o.jit ?? 1.4;
    for (let p = 0; p < passes; p++) {
      const q = pts.map(([x, y]) => [x + (r() - 0.5) * jit * 2, y + (r() - 0.5) * jit * 2]);
      SK.pen(ctx, q, w * (p ? 0.75 : 1) * (0.85 + r() * 0.3), { col: o.col, alpha: (o.alpha ?? 1) * (p ? 0.8 : 1), seed: (r() * 1e6) | 0, t0: 0.06, t1: 0.15, min: 0.4 });
    }
  };

  // ---------- scribble ----------
  /** Draw a zigzag as one stroked path: each leg slightly bowed, turns rounded by the round join. */
  function strokeZig(ctx, pts, lw, r, bow = 0.08) {
    if (pts.length < 2) return;

    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], dx = b[0] - a[0], dy = b[1] - a[1];
      const k = (r() - 0.5) * 2 * bow;
      ctx.quadraticCurveTo((a[0] + b[0]) / 2 - dy * k, (a[1] + b[1]) / 2 + dx * k, b[0], b[1]);

  /** One scribble patch: a zigzag of `len` along angle `ang`, `wid` across, legs `sp` apart. The unit of tone. */

      ctx.lineWidth = lw; ctx.beginPath();
      for (let k = 0; k <= n; k++) {

      const off = -wid / 2 + (k * wid) / n + (r() - 0.5) * sp * 0.6;

  /** A tonal field. field(x, y) → { d: darkness 0..1, ang, len, wid } (or null to skip).
   *  o: { w, h, cell, seed, layers: [{ thr, dAng, spMax, spMin, lw }], col, alpha, x0, y0 } */
  SK.hatch = (ctx, o) => {
    const r = SK.rng(o.seed ?? 5), cell = o.cell ?? 24;
    ctx.save(); ctx.strokeStyle = o.col || P.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (let li = 0; li < o.layers.length; li++) {
      const L = o.layers[li];
      for (let gy = (o.y0 ?? 0) - cell; gy < (o.h ?? 0) + cell; gy += cell) {

          const sp = SK.lerp(L.spMax, L.spMin, Math.pow(k, 0.8));
          ctx.globalAlpha = (o.alpha ?? 0.9) * (0.7 + 0.3 * j2) * SK.clamp(0.35 + k * 1.5);

          SK.zigzag(ctx, x, y, ang + (j3 - 0.5) * (L.angJit ?? 0.22) * (f.jit ?? 1), f.len * (0.6 + 0.8 * j4), f.wid * (0.7 + 0.6 * j5), sp, (L.lw ?? 1.1) * (f.lw ?? 1) * (0.8 + 0.4 * r()), r);
        }
      }
    }

  };

  /** Scribble-fill a polygon: lines across at angle `ang`, joined back and forth into a continuous scribble that
   *  overshoots the outline. o: { ang, sp, lw, over, keep (0..1 chance a leg is drawn), r, brk (legs per pen lift), alpha, col, skip(x,y) } */
  SK.fill = (ctx, poly, o) => {
    const r = o.r, a = o.ang, ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux;
    const pr = poly.map(([x, y]) => [x * vx + y * vy, x * ux + y * uy]);
    let sMin = Infinity, sMax = -Infinity;
    for (const p of pr) { sMin = Math.min(sMin, p[0]); sMax = Math.max(sMax, p[0]); }
    const sp = o.sp, over = o.over ?? 4, keep = o.keep ?? 1, brk = o.brk ?? 14;
    ctx.save(); ctx.strokeStyle = o.col || P.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.globalAlpha *= o.alpha ?? 1;

        const p = pr[i], q = pr[(i + 1) % pr.length];

      }

    SK.pen(ctx, pts, o.lw ?? 1.6, { col: o.col, alpha: o.alpha ?? 1, seed: (r() * 1e6) | 0, seg: 4, t0: 0.1, t1: 0.2, min: 0.35 });
  };

  /** Warm lamplight wash: a soft radial spot of ochre, multiplied onto the paper. o: { sx, sy (squash), col } */

    ctx.save();

    glassTop: gy - 40 * s, glassBot: gy + 36 * s, wTop: 33 * s, wBot: 20 * s,   // half widths of the glass
    roofBrim: gy - 46 * s, roofTop: gy - 104 * s, brim: 46 * s,
    cup: gy + 54 * s, collar: gy + 70 * s, arm: gy + 96 * s, armW: 44 * s,
    shaftTop: gy + 74 * s, shaftW0: 5 * s, shaftW1: 9 * s,
    ring: by - 120 * s, plinth: by - 70 * s, plinthW: 22 * s, footW: 30 * s,

  /** The lamp as a sketch: iron parts scribbled dark, glass left as paper, lines that search a little. */
  SK.lamp = (ctx, L, seed = 1, o = {}) => {
    const r = SK.rng(seed), s = L.s, x = L.x, lw = 1.7 * s, ink = P.ink;
    ctx.save();
    // shaft: two loose lines and a dark vertical scribble between them
    const shaft = [[x - L.shaftW0, L.shaftTop], [x + L.shaftW0, L.shaftTop], [x + L.shaftW1, L.plinth], [x - L.shaftW1, L.plinth]];
    SK.fill(ctx, shaft, { ang: Math.PI / 2 + 0.05, sp: 2.1 * s, lw: 1.3 * s, over: 2.5 * s, r, brk: 9, alpha: 0.95 });
    SK.line(ctx, [x - L.shaftW0, L.shaftTop], [x - L.shaftW1, L.plinth], lw, r, { over: 8 * s });
    SK.line(ctx, [x + L.shaftW0, L.shaftTop], [x + L.shaftW1, L.plinth], lw * 0.8, r, { over: 8 * s, passes: 1 });
    // rings on the shaft
    for (const [yy, ww] of [[L.ring, 14 * s], [L.ring + 12 * s, 12 * s], [L.collar + 6 * s, 10 * s]]) {
      SK.fill(ctx, [[x - ww, yy - 4 * s], [x + ww, yy - 4 * s], [x + ww * 0.9, yy + 4 * s], [x - ww * 0.9, yy + 4 * s]], { ang: 0.1, sp: 2 * s, lw: 1.2 * s, over: 2 * s, r, alpha: 0.95 });

  const dark = (x, y) => night(x, y).n * (1 - light(x, y));

  // ---------- the passers-by ----------
  // xa → xb is one walk per loop; both ends lie on blank paper, so the jump back is never seen.
  // tc: the moment each one passes the lamp, staggered by about 2 s so the light is rarely empty
  const WALKERS = [
    { id: 4, kind: 'umbrella', h: 168, y: 944, dir: -1, xa: 1010, xb: 300, tc: 3.2 },
    { id: 3, kind: 'hat', h: 206, y: 986, dir: 1, xa: 90, xb: 930, tc: 4.8 },
    { id: 2, kind: 'umbrella', h: 300, y: 1098, dir: -1, xa: 1200, xb: 10, tc: 5.6 },
    { id: 1, kind: 'umbrella', h: 420, y: 1236, dir: 1, xa: -300, xb: 1350, tc: 1.4 },
  ].map((w) => ({ ...w, off: ((((LX - w.xa) / (w.xb - w.xa) - w.tc / DUR) % 1) + 1) % 1, cycles: 5, step: Math.abs(w.xb - w.xa) / 5 / 4 / w.h }));

  const frameOf = (t) => ((Math.floor(t * FPS + 1e-6) % NF) + NF) % NF;
  /** Position, pose and visibility of walker w at time t. */
  function walk(w, t) {
    const u = (((t / DUR) + w.off) % 1 + 1) % 1, x = w.xa + (w.xb - w.xa) * u;
    const F = SK.walker({ ...w, x, dur: DUR, phase: w.off * w.cycles }, t);
    const fade = SK.smooth(0, 0.1, u) * (1 - SK.smooth(0.9, 1, u));
    F.vis = fade * SK.clamp(vign(x, w.y - w.h * 0.5) * 1.25);
    F.lit = light(x, w.y - w.h * 1.15);
    return F;
  }

  // ---------- rain ----------
  const DROPS = Array.from({ length: 260 }, (_, i) => {
    const z = SK.hash(i, 3, SEED);
    return { x0: SK.hash(i, 1, SEED), ph: SK.hash(i, 2, SEED), z, k: 9 + Math.floor(SK.hash(i, 4, SEED) * 3), len: 60 + 70 * SK.hash(i, 5, SEED),
      yg: HZ + 12 + Math.pow(z, 0.9) * (H - HZ + 40) };
  });
  const SLANT = -0.2, SPAN = H + 260;

  function drawRain(ctx, f) {
    const tq = f / FPS;
    ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < DROPS.length; i++) {
      const d = DROPS[i], u = (d.ph + (tq / DUR) * d.k) % 1;
      const yh = -160 + u * SPAN, yt = yh - d.len;        // head and tail of the streak
      const xAt = (y) => ((d.x0 * (W + 300) - 150 + SLANT * y) % (W + 300) + (W + 300)) % (W + 300) - 150;
      if (yt < d.yg) {
        const ye = Math.min(yh, d.yg), x1 = xAt(ye), x0 = x1 - SLANT * (ye - yt);
        const mx = (x0 + x1) / 2, my = (yt + ye) / 2, V = vign(mx, my);
        if (V > 0.03) {
          const L = light(mx, my), n = night(mx, my).n * (1 - L);
          const vis = V * (0.35 + 0.65 * L) * (0.5 + 0.5 * d.z);
          if (n > 0.38) { ctx.strokeStyle = P.paperLight; ctx.globalAlpha = Math.min(1, vis * 1.5); }
          else { ctx.strokeStyle = P.ink; ctx.globalAlpha = Math.min(1, vis * 1.1); }
          ctx.lineWidth = 0.75 + 0.55 * d.z;
          ctx.beginPath(); ctx.moveTo(x0, yt); ctx.lineTo(x1, ye); ctx.stroke();
        }
      }
      // splash: the two drawings after the drop reaches its ground
      const back = (yh - d.yg) / (SPAN * d.k / DUR / FPS);
      if (back >= 0 && back < 2) {
        const sx = xAt(d.yg), sy = d.yg, L = light(sx, sy), V = vign(sx, sy);
        if (L > 0.22 && V > 0.2) {
          const s = 0.5 + d.z * 0.9, o = back < 1 ? 1 : 1.7;
          ctx.strokeStyle = P.ink; ctx.globalAlpha = V * Math.min(1, L * 1.3) * (back < 1 ? 0.8 : 0.45); ctx.lineWidth = 0.9 * s;
          ctx.beginPath(); ctx.ellipse(sx, sy, 5 * s * o, 1.5 * s * o, 0, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  // ---------- still layers ----------
  function farLamp(ctx, r) {
    const x = FAR.x, gy = FAR.y;
    SK.line(ctx, [x, gy + 14], [x, FAR.by], 2.2, r, { over: 3, passes: 2 });
    SK.line(ctx, [x - 9, gy + 22], [x + 9, gy + 22], 1.4, r, { passes: 1, over: 1 });
    SK.path(ctx, [[x - 7, gy - 9], [x - 5, gy + 10], [x + 5, gy + 10], [x + 7, gy - 9]], 1.3, r, { passes: 1, jit: 0.5 });
    SK.fill(ctx, [[x - 11, gy - 9], [x, gy - 21], [x + 11, gy - 9]], { ang: -1, sp: 1.6, lw: 1, over: 1, r });
    SK.line(ctx, [x - 14, FAR.by + 1], [x + 14, FAR.by + 1], 1.3, r, { passes: 1, over: 3 });
  }

  /** Paints the still back layer: paper, the warm wash, the scribbled night, walls and windows, the wet street. */
  function paintBack(b) {
    SK.paper(b, W, H, SEED);
    // the lamplight is the only colour: a thin wash under the ink
    SK.wash(b, LX, LY + 4, 170, 0.5);
    b.save(); b.globalCompositeOperation = 'multiply'; b.filter = 'blur(26px)';
    const g = b.createLinearGradient(0, LY, 0, POOL.y);
    g.addColorStop(0, 'rgba(233,190,98,0.26)'); g.addColorStop(1, 'rgba(233,190,98,0.12)');
    b.fillStyle = g; b.beginPath(); b.moveTo(LX - 26, LY + 40); b.lineTo(LX + 26, LY + 40); b.lineTo(POOL.x + POOL.rx * 0.85, POOL.y); b.lineTo(POOL.x - POOL.rx * 0.85, POOL.y); b.closePath(); b.fill();
    b.restore();
    SK.wash(b, POOL.x, POOL.y, POOL.rx * 1.05, 0.4, { sy: 0.32 });
    SK.wash(b, LX, POOL.y + 120, 150, 0.3, { sx: 0.22 });
    SK.wash(b, FAR.x, FAR.y, 60, 0.45);
    SK.wash(b, FAR.x, FAR.by + 6, 80, 0.3, { sy: 0.22 });
    for (const [x, y, w, h, lit] of WINDOWS) if (lit) SK.wash(b, x + w / 2, y + h / 2, w * 0.95, 0.42, { sy: h / w });

    // the darkness, scribbled
    SK.hatch(b, {
      w: W, h: H, cell: 26, seed: SEED, alpha: 0.9,
      field: (x, y) => { const V = vign(x, y); if (V < 0.02) return null; const N = night(x, y); return { d: N.n * (1 - light(x, y)) * V, angs: N.angs, len: N.len, wid: N.wid, jit: N.jit }; },
      layers: [
        { thr: 0.1, spMax: 13, spMin: 4.2, lw: 1.7 },
        { thr: 0.36, spMax: 12, spMin: 4.6, lw: 1.55 },
        { thr: 0.56, spMax: 10, spMin: 4.2, lw: 1.5 },
        { thr: 0.74, spMax: 8, spMin: 3.6, lw: 1.6 },
      ],
    });

    const r = SK.rng(SEED + 1), inside = (x, y) => vign(x, y) > 0.35;
    // lit windows: scraped back to paper after the hatching, then a little wash
    for (const [x, y, w, h, lit] of WINDOWS) {
      if (!lit || !inside(x + w / 2, y + h / 2)) continue;
      b.save(); b.fillStyle = P.paperLight; b.globalAlpha = 0.82; b.beginPath();
      b.moveTo(x + r() * 2, y + r() * 2); b.lineTo(x + w - r() * 2, y + r() * 2); b.lineTo(x + w - r() * 2, y + h - r() * 2); b.lineTo(x + r() * 2, y + h - r() * 2); b.closePath(); b.fill(); b.restore();
      SK.wash(b, x + w / 2, y + h / 2, w * 0.8, 0.5, { sy: h / w });
    }
    // walls: loose edges, only where the sketch is drawn
    const lineIn = (a, c, w, o) => {
      const n = 8; let run = null;
      for (let i = 0; i <= n; i++) {
        const q = [a[0] + ((c[0] - a[0]) * i) / n, a[1] + ((c[1] - a[1]) * i) / n], ok = vign(q[0], q[1]) > 0.4;
        if (ok && !run) run = q;
        if ((!ok || i === n) && run) { const e = ok ? q : [a[0] + ((c[0] - a[0]) * (i - 1)) / n, a[1] + ((c[1] - a[1]) * (i - 1)) / n]; if (Math.hypot(e[0] - run[0], e[1] - run[1]) > 20) SK.line(b, run, e, w, r, o); run = null; }
      }
    };
    lineIn([735, 460], [736, 786], 1.6, { over: 10 });
    lineIn([728, 458], [906, 457], 1.5, { over: 10 });
    lineIn([904, 414], [905, 470], 1.4, { passes: 1 });
    lineIn([208, 524], [209, 788], 1.6, { over: 10 });
    lineIn([60, 523], [214, 521], 1.5, { over: 10 });
    // windows: the lit ones get a cross, every one a sill
    for (const [x, y, w, h, lit] of WINDOWS) {
      if (!inside(x + w / 2, y + h / 2)) continue;
      if (lit) {
        SK.line(b, [x + w / 2, y + 2], [x + w / 2, y + h - 2], 1.2, r, { passes: 1, over: 1 });
        SK.line(b, [x + 2, y + h * 0.42], [x + w - 2, y + h * 0.42], 1.2, r, { passes: 1, over: 1 });
        SK.line(b, [x - 2, y], [x + w + 2, y], 1.4, r, { passes: 1, over: 2 });
      }
      SK.line(b, [x - 5, y + h + 3], [x + w + 5, y + h + 3], 1.7, r, { passes: 1, over: 2 });   // sill
    }
    // where the houses meet the street
    lineIn([150, 788], [1000, 790], 1.3, { over: 30, passes: 2, alpha: 0.85 });
    farLamp(b, r);
    // the wet street: flat ripples across the streak of the lamp, a few long reflections
    b.save(); b.strokeStyle = P.ink; b.lineJoin = 'round'; b.lineCap = 'round';
    for (let y = POOL.y + 22; y < H - 20; y += 12 + r() * 14) {
      const half = 16 + (y - POOL.y) * 0.1 + r() * 22, x = LX + (r() - 0.5) * 22;
      if (vign(x, y) < 0.2) continue;
      b.globalAlpha = 0.85 * vign(x, y);
      SK.zigzag(b, x, y, 0.03 * (r() - 0.5), half * 2, 4 + r() * 6, 3.4, 1.4, r);
    }
    for (let y = FAR.by + 10; y < FAR.by + 120; y += 9 + r() * 8) { b.globalAlpha = 0.7; SK.zigzag(b, FAR.x, y, 0, 18 + r() * 10, 3, 3, 1.1, r); }
    b.restore();
  }

  /** Build the still layers: back, and the lamp in four slightly different drawings (it boils, 2 drawings/s). */
  function build() {
    const back = SK.canvas(W, H);
    paintBack(back.getContext('2d'));
    const lamps = [0, 1, 2, 3].map((k) => { const c = SK.canvas(W, H); SK.lamp(c.getContext('2d'), LAMP, SEED * 10 + k); return c; });
    return { back, lamps };
  }

  /** One frame at time t. */
  function draw(ctx, t, L) {
    const f = frameOf(t), tq = f / FPS;
    ctx.save();
    ctx.drawImage(L.back, 0, 0, W, H);
    const Fs = WALKERS.map((w) => [w, walk(w, tq)]);
    // reflections first (they lie on the street), then the people behind the lamp, the lamp, the people in front
    for (const [w, F] of Fs) SK.reflection(ctx, F, { seed: w.id * 7919 + f + SALT, vis: F.vis, alpha: 0.9 });
    const person = (w, F) => {
      const s = w.id * 104729 + f * 31 + SALT;
      SK.figure(ctx, F, { seed: s, vis: F.vis, lit: F.lit, sp: 2.4 + 120 / w.h, ghost: 0.18 });
    };
    for (const [w, F] of Fs) if (w.y < LAMP.by) person(w, F);
    ctx.drawImage(L.lamps[Math.floor(f / 4) % 4], 0, 0, W, H);
    for (const [w, F] of Fs) if (w.y >= LAMP.by) person(w, F);
    drawRain(ctx, f);
    ctx.restore();
  }

  G.PassersBy = { W, H, DUR, FPS, build, draw, light, vign, night, dark, LAMP, WALKERS, walk, frameOf };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>

// Passers-by: an 8 s seamless loop, 8 drawings per second.
// Keys: space = pause, s = save PNG.  URL: ?t=2.5 starts (and pauses) at that moment, ?seed=12 draws another night.
const q = new URLSearchParams(location.search);
(function () {
  const S = PassersBy, cv = document.getElementById('art'), ctx = cv.getContext('2d');
  cv.width = S.W; cv.height = S.H;
  const L = S.build();
  let t0 = performance.now() - params.t * 1000, paused = q.has('t'), tp = params.t;
  const now = () => (paused ? tp : ((performance.now() - t0) / 1000) % S.DUR);
  window.renderAt = (t) => S.draw(ctx, t, L);
  S.draw(ctx, now(), L);
  window.done = true;
  const loop = () => { S.draw(ctx, now(), L); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  addEventListener('keydown', (e) => {
    if (e.key === ' ') { if (paused) { t0 = performance.now() - tp * 1000; paused = false; } else { tp = now(); paused = true; } e.preventDefault(); }
    if (e.key === 's') { const a = document.createElement('a'); a.download = `passers-by_s${params.seed}_t${now().toFixed(2)}.png`; a.href = cv.toDataURL('image/png'); a.click(); }
  });
})();

</script>
