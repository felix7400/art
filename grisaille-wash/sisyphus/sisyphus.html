<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sisyphus · grisaille wash</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1d1c; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
<canvas id="art" role="img" aria-label="A grey watercolour loop: a man in a frock coat and top hat pushes a boulder up a misty hill, lets it roll back, looks out into the light and walks back down with his hands behind his back."></canvas>
<script>
/* grisaille.js — drawing library for the style "Grisaille Wash" (Canvas 2D, no dependencies).
 *
 * Everything is grey watercolour on warm paper: one pigment, many dilutions. Light is the paper
 * left untouched; fog is paper lifted back over the paint. Every wash is built the way a brush
 * lays it down:
 *   1. the shape is deformed recursively (Tyler Hobbs' polygon method) and stacked 20–40 times
 *      at low opacity, so edges are soft and uneven but the body is solid;
 *   2. pigment collects at the drying edge (edge darkening: the shape minus its own blur);
 *   3. the density is broken by low-frequency mottling and paper grain (granulation);
 *   4. the result is multiplied onto the paper, so layers glaze like real transparent paint.
 *
 * All randomness runs through seeded generators (GW.rng). Nothing depends on time or Math.random,
 * so a scene renders the same on every machine and every frame of an animation can be redrawn alone.
 *
 * Main API (x right, y down, units px):
 *   GW.palette                      paper, ink and the tone ladder
 *   GW.rng(seed)                    mulberry32 → () => 0..1;  GW.gauss(r)
 *   GW.noise(seed) → (x, y) => -1..1   gradient noise;  GW.fbm(n, x, y, oct)
 *   GW.canvas(w, h)                 offscreen canvas
 *   GW.textures(w, h, seed)         paper grain, granulation and mottle textures (made once per size)
 *   GW.paper(ctx, w, h, T)          paints the bare paper
 *   GW.deform(poly, depth, v, r)    recursive midpoint deformation
 *   GW.wash(ctx, poly, o)           one watercolour wash (see options below)
 *   GW.bloom(ctx, x, y, rad, o)     back-run (cauliflower edge): lighter inside, dark fractal rim
 *   GW.trunk(ctx, o)                a tree trunk: wobbly sides, darker edges, streaks, wet fade
 *   GW.fog(ctx, blobs, o)           lifted paper: soft bands of fog
 *   GW.dash(ctx, x0, y0, x1, y1, o) the cast-shadow stroke under figures
 *   GW.gentleman(ctx, P)            the figure: frock coat, top hat, 2.5D puppet with IK
 *   GW.stoneTexture(R, seed) / GW.stone(ctx, tex, x, y, R, angle, o)
 *   GW.birds(ctx, list, t)          tiny far birds
 */
(function (G) {
  'use strict';
  const GW = {};

  // ---------- palette ----------
  // One pigment (a neutral Payne's grey) on warm paper. Tones are pigment strength 0..1.
  GW.palette = {
    paper: '#ECE9E2',      // bare paper, also the colour of fog and light
    paperShade: '#E2DED5', // paper in the shadow of the page (vignette)
    ink: '#1C1D1F',        // full-strength pigment
    pigment: '#2B2D30',    // the wash colour that is multiplied in
    ladder: [0.06, 0.12, 0.2, 0.3, 0.42, 0.55, 0.7, 0.85, 0.95],
  };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  GW.hex = hex;
  /** Colour of a tone painted on paper: 0 = paper, 1 = ink. */
  GW.tone = (t, alpha = 1) => {
    const p = hex(GW.palette.paper), k = hex(GW.palette.ink);
    const c = p.map((v, i) => Math.round(v + (k[i] - v) * t));
    return alpha >= 1 ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
  };
  GW.paperRGBA = (a) => { const p = hex(GW.palette.paper); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; };

  // ---------- randomness ----------
  GW.rng = function (a) {
    a = (a | 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  GW.gauss = (r) => { let u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  /** 2D gradient noise, seeded. Returns (x, y) => about -1..1. */
  GW.noise = function (seed) {
    const r = GW.rng(seed * 9301 + 49297), perm = new Uint8Array(512), gx = new Float32Array(256), gy = new Float32Array(256);
    const p = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
    for (let i = 0; i < 256; i++) { const a = r() * Math.PI * 2; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
    const f = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    return function (x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const X = xi & 255, Y = yi & 255;
      const g = (i, j, dx, dy) => { const h = perm[perm[X + i] + Y + j]; return gx[h] * dx + gy[h] * dy; };
      const n00 = g(0, 0, xf, yf), n10 = g(1, 0, xf - 1, yf), n01 = g(0, 1, xf, yf - 1), n11 = g(1, 1, xf - 1, yf - 1);
      const u = f(xf), v = f(yf);
      return 1.41 * ((n00 + (n10 - n00) * u) + ((n01 + (n11 - n01) * u) - (n00 + (n10 - n00) * u)) * v);
    };
  };
  GW.fbm = (n, x, y, oct = 4, lac = 2, gain = 0.5) => { let s = 0, a = 1, w = 0; for (let i = 0; i < oct; i++) { s += a * n(x, y); w += a; x *= lac; y *= lac; a *= gain; } return s / w; };

  // ---------- canvases and textures ----------
  GW.canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

  /** Alpha texture from a function f(x, y) → 0..1, computed at 1/step resolution and smoothed up. */
  GW.alphaTexture = function (w, h, step, f) {
    const sw = Math.ceil(w / step) + 1, sh = Math.ceil(h / step) + 1, small = GW.canvas(sw, sh), sx = small.getContext('2d');
    const img = sx.createImageData(sw, sh), d = img.data;
    for (let j = 0; j < sh; j++) for (let i = 0; i < sw; i++) {
      const k = (j * sw + i) * 4, a = Math.max(0, Math.min(1, f(i * step, j * step)));
      d[k] = d[k + 1] = d[k + 2] = 0; d[k + 3] = Math.round(a * 255);
    }
    sx.putImageData(img, 0, 0);
    if (step === 1) return small;
    const big = GW.canvas(w, h), bx = big.getContext('2d');
    bx.imageSmoothingEnabled = true; bx.imageSmoothingQuality = 'high';
    bx.drawImage(small, 0, 0, sw * step, sh * step);
    return big;
  };

  /**
   * The paper textures every wash is filtered through. Made once per canvas size.
   *  grain:   fine tooth of cold-pressed paper (1–3 px), alpha 0.62..1 → granulation
   *  mottle:  slow pigment variation inside a wash (40–300 px), alpha 0.45..1
   *  streak:  mottle stretched vertically, for trunks
   *  tooth:   the paper surface itself (very light), multiplied on top of everything at the end
   */
  GW.textures = function (w, h, seed = 7) {
    const key = `${w}x${h}:${seed}`;
    GW._tex = GW._tex || {};
    if (GW._tex[key]) return GW._tex[key];
    const n1 = GW.noise(seed), n2 = GW.noise(seed + 1), n3 = GW.noise(seed + 2), r = GW.rng(seed + 3);
    const grain = (() => {
      const c = GW.canvas(w, h), x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data;
      const sm = (a, b, t) => { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); };
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        const k = (j * w + i) * 4;
        // clumps of 2–6 px (pigment settling in the paper's valleys), some fine speckle, slow variation of how much it granulates
        const fine = r(), clump = n1(i * 0.28, j * 0.28) * 0.5 + 0.5, clump2 = n2(i * 0.11 + 40, j * 0.11) * 0.5 + 0.5, coarse = n2(i * 0.02, j * 0.02) * 0.5 + 0.5;
        const v = 0.22 * fine + 0.48 * clump + 0.3 * clump2;
        const a = 0.68 + 0.32 * sm(0.3 - 0.12 * coarse, 0.75, v);
        d[k] = d[k + 1] = d[k + 2] = 0; d[k + 3] = Math.round(255 * a);
      }
      x.putImageData(img, 0, 0);
      return c;
    })();
    const mottle = GW.alphaTexture(w, h, 4, (x, y) => {
      const wx = x + 60 * n3(x * 0.004, y * 0.004), wy = y + 60 * n3(x * 0.004 + 9, y * 0.004 + 9);
      const v = GW.fbm(n1, wx * 0.0045, wy * 0.0045, 5) * 0.5 + 0.5;
      return 0.45 + 0.55 * Math.pow(Math.min(1, Math.max(0, v * 1.15 - 0.05)), 0.9);
    });
    const streak = GW.alphaTexture(w, h, 3, (x, y) => {
      const v = GW.fbm(n2, x * 0.06, y * 0.0035, 4) * 0.5 + 0.5;
      return 0.5 + 0.5 * v;
    });
    // blotches: pigment pools with dried tide lines (the cloudy back-runs of a wet wash)
    const n4 = GW.noise(seed + 4), n5 = GW.noise(seed + 5);
    const blotch = GW.alphaTexture(w, h, 1, (x, y) => {
      const wx = x + 110 * n4(x * 0.0025, y * 0.0025) + 10 * n5(x * 0.035, y * 0.035), wy = y + 110 * n4(x * 0.0025 + 5.2, y * 0.0025 + 1.3) + 10 * n5(x * 0.035 + 7, y * 0.035);
      const v = GW.fbm(n3, wx * 0.0026, wy * 0.0026, 4);
      const sm = (a, b, t) => { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); };
      const pool = sm(0.02, 0.1, v);                                              // where the pigment pooled
      const where = sm(0.05, 0.35, n5(x * 0.0018 + 3, y * 0.0018));               // tide lines only in some places
      const tide = Math.exp(-Math.pow((v - 0.1) / 0.011, 2)) * where;
      const soft = GW.fbm(n5, x * 0.01, y * 0.01, 3) * 0.5 + 0.5;
      return 0.5 + 0.22 * pool + 0.32 * tide + 0.12 * (soft - 0.5);
    });
    const tooth = GW.alphaTexture(w, h, 1, (x, y) => {
      const v = n1(x * 0.5 + 300, y * 0.5) * 0.5 + 0.5, f = n2(x * 0.11, y * 0.11) * 0.5 + 0.5;
      return 0.035 + 0.05 * v * f;
    });
    return (GW._tex[key] = { w, h, grain, mottle, streak, tooth, blotch });
  };

  /** Bare paper: warm base, a little uneven tone, darker towards the page edge. */
  GW.paper = function (ctx, w, h, T) {
    ctx.save();
    ctx.fillStyle = GW.palette.paper; ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w * 0.55, h * 0.45, Math.min(w, h) * 0.35, w * 0.5, h * 0.5, Math.hypot(w, h) * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(60,55,45,0.10)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.restore();
  };

  /** The paper tooth, laid over everything at the very end (multiply). */
  GW.tooth = function (ctx, T, a = 1) {
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a;
    const c = GW._toothTint || (GW._toothTint = {});
    const key = T.w + 'x' + T.h;
    if (!c[key]) { const t = GW.canvas(T.w, T.h), x = t.getContext('2d'); x.drawImage(T.tooth, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#3a3328'; x.fillRect(0, 0, T.w, T.h); c[key] = t; }
    ctx.drawImage(c[key], 0, 0);
    ctx.restore();
  };

  // ---------- shapes ----------
  /** Recursive midpoint deformation. poly: [[x, y, v?]], v = local variance (default 1). */
  GW.deform = function (poly, depth, variance, r) {
    let p = poly.map((q) => [q[0], q[1], q[2] == null ? 1 : q[2]]);
    for (let d = 0; d < depth; d++) {
      const out = [];
      for (let i = 0; i < p.length; i++) {
        const a = p[i], b = p[(i + 1) % p.length];
        out.push(a);
        const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const v = (a[2] + b[2]) * 0.5 * (0.6 + 0.8 * r());
        const sd = len * variance * v;
        out.push([(a[0] + b[0]) / 2 + GW.gauss(r) * sd, (a[1] + b[1]) / 2 + GW.gauss(r) * sd, v]);
      }
      p = out;
    }
    return p;
  };
  /** Subdivide a polygon so no edge is longer than maxLen (keeps per-vertex variance). */
  GW.densify = function (poly, maxLen) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / maxLen));
      for (let k = 0; k < n; k++) { const t = k / n; out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, (a[2] == null ? 1 : a[2]) * (1 - t) + (b[2] == null ? 1 : b[2]) * t]); }
    }
    return out;
  };
  GW.path = (ctx, p) => { ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); };
  GW.bbox = (p, pad = 0) => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const q of p) { if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; } return { x: Math.floor(x0 - pad), y: Math.floor(y0 - pad), w: Math.ceil(x1 - x0 + 2 * pad), h: Math.ceil(y1 - y0 + 2 * pad) }; };
  GW.circlePoly = (cx, cy, rx, ry = rx, n = 24, v = 1) => Array.from({ length: n }, (_, i) => { const a = (i / n) * Math.PI * 2; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, v]; });

  // ---------- the wash ----------
  /**
   * One watercolour wash, multiplied onto ctx.
   * o.tone      pigment strength 0..1 (default 0.3)
   * o.seed      seed for the deformation
   * o.layers    number of stacked deformed copies (default 28)
   * o.spread    deformation of the base shape (default 0.06), o.jitter of each layer (default 0.04)
   * o.depth     recursion depth (default 4)
   * o.edge      edge darkening strength 0..1 (default 0.55), o.edgeWidth in px (default 6)
   * o.mottle    0..1 how much slow variation (default 0.7), o.grain 0..1 granulation (default 0.8)
   * o.soft      blur in px for wet edges (default 0)
   * o.fade      [{x0,y0,x1,y1,stops:[[t,a],…]}] alpha gradients multiplied in (wet-in-wet fade)
   * o.clip      polygon or function(ctx) restricting the wash
   * o.T         textures from GW.textures (required)
   * o.mode      composite operation (default 'multiply')
   * o.into      draw into this canvas instead of compositing (returns the layer)
   */
  GW.wash = function (ctx, poly, o = {}) {
    const T = o.T, r = GW.rng(o.seed == null ? 1 : o.seed);
    const layers = o.layers ?? 28, depth = o.depth ?? 4, spread = o.spread ?? 0.06, jitter = o.jitter ?? 0.04;
    const base0 = GW.densify(poly, o.maxLen ?? 120);
    const base = GW.deform(base0, Math.max(1, depth - 2), spread, r);
    const bb = GW.bbox(base, 40 + (o.soft || 0) * 3 + (o.edgeWidth ?? 6) * 3);
    const L = GW.canvas(bb.w, bb.h), x = L.getContext('2d');
    x.translate(-bb.x, -bb.y);
    if (o.clip) { if (typeof o.clip === 'function') o.clip(x); else { GW.path(x, o.clip); x.clip(); } }
    if (o.soft) x.filter = `blur(${o.soft}px)`;
    x.fillStyle = '#000';
    const a = 1 - Math.pow(1 - (o.body ?? 0.93), 1 / layers);   // per-layer alpha so the stack reaches `body`
    for (let i = 0; i < layers; i++) {
      const p = GW.deform(base, 2, jitter, r);
      x.globalAlpha = a; GW.path(x, p); x.fill();
    }
    x.filter = 'none'; x.globalAlpha = 1;
    x.setTransform(1, 0, 0, 1, 0, 0);
    // edge darkening: rim = shape − blur(shape)
    const edge = o.edge ?? 0.55;
    if (edge > 0) {
      const B = GW.canvas(bb.w, bb.h), bx = B.getContext('2d');
      bx.filter = `blur(${o.edgeWidth ?? 6}px)`; bx.drawImage(L, 0, 0); bx.filter = 'none';
      const R = GW.canvas(bb.w, bb.h), rx = R.getContext('2d');
      rx.drawImage(L, 0, 0); rx.globalCompositeOperation = 'destination-out'; rx.drawImage(B, 0, 0);
      x.globalAlpha = edge; x.drawImage(R, 0, 0); x.globalAlpha = 1;
    }
    // wet-in-wet fades
    if (o.fade) for (const f of o.fade) {
      const g = x.createLinearGradient(f.x0 - bb.x, f.y0 - bb.y, f.x1 - bb.x, f.y1 - bb.y);
      for (const [t, al] of f.stops) g.addColorStop(t, `rgba(0,0,0,${al})`);
      x.globalCompositeOperation = 'destination-in'; x.fillStyle = g; x.fillRect(0, 0, bb.w, bb.h);
    }
    if (o.radial) for (const f of o.radial) {
      const g = x.createRadialGradient(f.x - bb.x, f.y - bb.y, f.r0, f.x - bb.x, f.y - bb.y, f.r1);
      for (const [t, al] of f.stops) g.addColorStop(t, `rgba(0,0,0,${al})`);
      x.globalCompositeOperation = 'destination-in'; x.fillStyle = g; x.fillRect(0, 0, bb.w, bb.h);
    }
    // mottling and granulation (sampled at a seeded offset so washes differ)
    if (T) {
      const mot = o.mottle ?? 0.7, gr = o.grain ?? 0.8;
      const tex = o.streaky ? T.streak : T.mottle;
      if (mot > 0) {
        x.globalCompositeOperation = 'destination-out'; x.globalAlpha = mot;
        const [ax, ay] = GW.anchor(tex, bb, r);
        GW.tile(x, GW._inverse(tex), ax, ay, bb.w, bb.h);
        x.globalAlpha = 1;
      }
      const bl = o.blotch ?? 0;
      if (bl > 0) {
        x.globalCompositeOperation = 'destination-out'; x.globalAlpha = bl;
        const [ax, ay] = GW.anchor(T.blotch, bb, r);
        GW.tile(x, GW._inverse(T.blotch), ax, ay, bb.w, bb.h);
        x.globalAlpha = 1;
      }
      if (gr > 0) {
        x.globalCompositeOperation = 'destination-out'; x.globalAlpha = gr;
        GW.tile(x, GW._inverse(T.grain), bb.x, bb.y, bb.w, bb.h);
        x.globalAlpha = 1;
      }
    }
    // colour it
    x.globalCompositeOperation = 'source-in'; x.fillStyle = o.color || GW.palette.pigment; x.fillRect(0, 0, bb.w, bb.h);
    x.globalCompositeOperation = 'source-over';
    if (o.into) { const c = o.into.getContext('2d'); c.save(); c.globalAlpha = o.tone ?? 0.3; c.globalCompositeOperation = o.mode || 'source-over'; c.drawImage(L, bb.x, bb.y); c.restore(); return L; }
    ctx.save(); ctx.globalCompositeOperation = o.mode || 'multiply'; ctx.globalAlpha = o.tone ?? 0.3; ctx.drawImage(L, bb.x, bb.y); ctx.restore();
    return { layer: L, x: bb.x, y: bb.y };
  };
  /** Inverted alpha copy of a texture (cached): alpha' = 1 − alpha. */
  GW._inverse = function (tex) {
    tex.__inv = tex.__inv || (() => {
      const c = GW.canvas(tex.width, tex.height), x = c.getContext('2d');
      x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
      x.globalCompositeOperation = 'destination-out'; x.drawImage(tex, 0, 0);
      return c;
    })();
    return tex.__inv;
  };

  /** Tile a texture over a w x h layer whose top-left sits at world (wx, wy): texture is anchored to world space. */
  /** Where to sample a texture for a layer at bb: inside one tile when it fits (no seam), else anchored to the world. */
  GW.anchor = function (tex, bb, r) {
    const tw = tex.width, th = tex.height;
    return [bb.w < tw ? Math.floor(r() * (tw - bb.w)) : bb.x, bb.h < th ? Math.floor(r() * (th - bb.h)) : bb.y];
  };
  GW.tile = function (x, tex, wx, wy, w, h) {
    const tw = tex.width, th = tex.height;
    const sx = -(((wx % tw) + tw) % tw), sy = -(((wy % th) + th) % th);
    for (let yy = sy; yy < h; yy += th) for (let xx = sx; xx < w; xx += tw) x.drawImage(tex, xx, yy);
  };

  /** Back-run (bloom): water creeping into a drying wash. Lifts pigment inside, leaves a dark fractal rim. */
  GW.bloom = function (ctx, cx, cy, rad, o = {}) {
    const r = GW.rng(o.seed ?? 3), T = o.T;
    const poly = GW.deform(GW.circlePoly(cx, cy, rad, rad * (o.squash ?? 0.75), 10), 5, o.rough ?? 0.22, r);
    const bb = GW.bbox(poly, 20), L = GW.canvas(bb.w, bb.h), x = L.getContext('2d');
    x.translate(-bb.x, -bb.y); x.fillStyle = '#000'; GW.path(x, poly); x.fill(); x.setTransform(1, 0, 0, 1, 0, 0);
    const B = GW.canvas(bb.w, bb.h), bx = B.getContext('2d'); bx.filter = `blur(${o.rim ?? 3}px)`; bx.drawImage(L, 0, 0); bx.filter = 'none';
    const R = GW.canvas(bb.w, bb.h), rx = R.getContext('2d'); rx.drawImage(L, 0, 0); rx.globalCompositeOperation = 'destination-out'; rx.drawImage(B, 0, 0);
    if (T) { rx.globalCompositeOperation = 'destination-out'; rx.globalAlpha = 0.6; GW.tile(rx, GW._inverse(T.grain), bb.x, bb.y, bb.w, bb.h); rx.globalAlpha = 1; }

    const low = GW.canvas(W + 240, H), lx = low.getContext('2d');
    lx.translate(120, 0);
    GW.fog(lx, [[150, 960, 420, 170, 0.95], [380, 1000, 330, 100, 0.85], [-60, 860, 260, 200, 0.85], [230, 905, 230, 90, 0.6],
      [1330, 900, 300, 90, 0.75], [1700, 880, 320, 110, 0.6]], { seed: 71, blur: 50 });

    // --- the ground in front: a dark, cloudy band of wash the whole picture stands on (like the reference) ---
    const ground = GW.canvas(W + 240, H), gx = ground.getContext('2d');
    gx.translate(120, 0);
    // overlapping cloud-shaped patches with dark drying edges, glazed over each other
    const rg = GW.rng(88);
    const patches = [];
    for (let i = 0; i < 12; i++) {
      const x = -60 + (i + rg() * 0.8) * (W + 120) / 12, y = 1000 + rg() * 95, rx = 140 + rg() * 220, ry = 32 + rg() * 50;
      patches.push([x, y, rx, ry, 0.15 + rg() * 0.15]);
    }
    patches.forEach(([x, y, rx, ry, tone], i) => {
      GW.wash(gx, GW.circlePoly(x, y, rx, ry, 14, 1), { T, seed: 881 + i, tone, spread: 0.14, jitter: 0.04, edge: 0.9, edgeWidth: 6, mottle: 0.6, blotch: 0.7, grain: 0.95, soft: i % 3 === 0 ? 8 : 0,
        fade: [{ x0: 0, y0: y - ry, x1: 0, y1: y + ry * 0.3, stops: [[0, 0.75], [1, 1]] }] });
    });
    [[700, 1058, 70, 0.5], [1420, 1068, 90, 0.45], [980, 1036, 40, 0.4]].forEach(([x, y, len, a], i) => GW.dash(gx, x, y, x - len * 3, y + 2, { w: 6, alpha: a, seed: 70 + i }));

    // --- vista fog (animated): bands over the ridges, drawn wider than the frame so it can drift ---
    const vista = GW.canvas(W + 200, H), fx = vista.getContext('2d');
    fx.translate(100, 0);
    GW.fog(fx, [[1350, 640, 340, 70, 0.9], [1700, 610, 380, 60, 0.85], [1500, 720, 420, 70, 0.9], [1900, 760, 300, 80, 0.85],
      [1250, 790, 200, 70, 0.8], [1600, 860, 460, 90, 0.95], [1950, 540, 260, 50, 0.6], [1450, 545, 240, 40, 0.6]], { seed: 73, blur: 34 });

    // --- seam fog: a bank lying in the hollow at the foot of the slope; it hides the loop point ---
    // painted like a wash, but with paper: lifted, soft, a little uneven
    const seam = GW.canvas(W + 300, H + 200), sx = seam.getContext('2d');
    sx.translate(150, 100);
    const nb = GW.noise(77), top = [], bot = [];
    for (let x = 330; x <= 940; x += 16) {
      const gy = S.groundY(x);
      // billows: rounded lobes along the top of the bank
      const lobe = 46 * Math.pow(Math.abs(Math.sin((x - 330) / 610 * Math.PI * 3.2 + 0.6)), 0.6) + 18 * nb(x * 0.02, 0.3);
      top.push([x, gy - 190 - lobe + 50 * Math.pow(Math.abs((x - 620) / 320), 2), 0.5]);
      bot.unshift([x, gy + 120, 0.5]);
    }
    const bankPoly = top.concat(bot);
    for (let k = 0; k < 2; k++) GW.wash(sx, bankPoly, { T, seed: 780 + k, tone: 1, color: GW.palette.paper, mode: 'source-over', layers: 24, spread: 0.02, jitter: 0.03,
      edge: 0, mottle: 0.25, blotch: 0.2, grain: 0, soft: 30, body: 0.97,
      fade: [{ x0: 330, y0: 0, x1: 940, y1: 0, stops: [[0, 0], [0.2, 1], [0.8, 1], [1, 0]] }] });
    GW.fog(sx, [[620, 600, 220, 110, 0.7], [520, 690, 180, 90, 0.7], [760, 560, 140, 80, 0.5], [450, 560, 120, 80, 0.4], [880, 470, 90, 60, 0.35]], { seed: 79, blur: 40 });

    // --- foreground trunks (opaque) ---
    const front = mk(), fr = front.getContext('2d');
    GW.trunk(fr, { T, seed: 901, x: 405, top: -30, bottom: H + 40, w: 150, tone: 0.96, grain: 0.4, taper: -0.06, lean: -10, opaque: true, fadeFrom: 880, fadeTo: H + 80, edge: 0.8, blotch: 0.3, mottle: 0.4 });
    GW.trunk(fr, { T, seed: 902, x: 88, top: -30, bottom: H + 40, w: 56, tone: 0.74, grain: 0.45, taper: -0.03, lean: 6, opaque: true, fadeFrom: 760, fadeTo: H - 20, edge: 0.7 });
    GW.trunk(fr, { T, seed: 903, x: 1852, top: -30, bottom: H + 40, w: 70, tone: 0.86, grain: 0.45, taper: -0.04, lean: -8, opaque: true, fadeFrom: 820, fadeTo: H + 20, edge: 0.75 });

    // --- drifting wisps in front of the hill (they sway with the camera and breathe) ---
    const wisps = [[760, 830, 260, 26], [1240, 880, 300, 30], [420, 600, 220, 22], [1560, 760, 240, 24]].map(([x, y, rx, ry], i) => {
      const c = GW.canvas(rx * 2 + 160, ry * 2 + 160), cx = c.getContext('2d');
      GW.fog(cx, [[rx + 80, ry + 80, rx, ry, 0.75], [rx + 80 - rx * 0.4, ry + 80 + 4, rx * 0.6, ry * 0.8, 0.5]], { seed: 90 + i, blur: 18, rough: 0.2 });
      return { c, x: x - rx - 80, y: y - ry - 80, phase: i * 1.7 };
    });
    const stone = GW.stoneTexture(S.R, 11, T);
    return { back, low, ground, vista, seam, front, stone, wisps, T };
  }

  /** shadow dash for a planted foot / the stone: lies on the slope, falls to the left (light from the right) */
  function shadow(ctx, x, len, w, alpha, seed) {
    const y0 = S.groundY(x) + 1.5, x1 = x - len, y1 = S.groundY(x1) + 1.5;
    GW.dash(ctx, x + 6, y0, x1, y1, { w, alpha, seed, tone: 0.85 });
  }

  // camera: a slow sideways drift over the loop; nearer layers move more (parallax)
  const ZOOM = 1.022;
  function camera(ctx, t, k) {
    const dx = 15 * Math.sin(2 * Math.PI * t / S.DUR + 0.5) * k;
    ctx.setTransform(ZOOM, 0, 0, ZOOM, (W / 2) * (1 - ZOOM) + dx, (H / 2) * (1 - ZOOM));
  }

  function draw(ctx, t, L) {
    const A = S.at(t), C = S.sceneAt(t), T = L.T;
    ctx.save();
    ctx.fillStyle = GW.palette.paper; ctx.fillRect(0, 0, W, H);
    camera(ctx, t, 1);
    ctx.drawImage(L.back, 0, 0);
    // vista fog: thick, lifts in the pause
    camera(ctx, t, 0.8);
    ctx.globalAlpha = 0.78 - 0.62 * C.open; ctx.drawImage(L.vista, -100 + 28 * C.drift, 0); ctx.globalAlpha = 1;
    camera(ctx, t, 1);
    // light: paper lifted around the sun
    if (C.open > 0.001) {
      const g = ctx.createRadialGradient(SUN[0], SUN[1], 20, SUN[0], SUN[1], 820);
      g.addColorStop(0, GW.paperRGBA(0.55 * C.open)); g.addColorStop(0.3, GW.paperRGBA(0.3 * C.open)); g.addColorStop(1, GW.paperRGBA(0));
      ctx.fillStyle = g; ctx.fillRect(-60, 0, W + 120, H);
    }
    GW.birds(ctx, C.birds, t, { tone: 0.62 });
    // shadows
    const st = A.stone, figFirst = t >= S.TL.pass[0] && t < S.TL.roll;   // walking behind the resting stone
    A.feetGround.forEach((f, i) => { if (f.planted) shadow(ctx, f.x, 0.36 * S.Hf, 4.5, 0.6, 20 + i); });
    if (st.visible) shadow(ctx, st.gx + 10, 1.6 * S.R, 6, 0.65 * st.alpha, 30);
    const drawStone = () => {
      if (!st.visible) return;
      // the boulder is not round: it rests on its lowest point and rocks a little as it turns
      const n = S.normal(st.gx), sup = GW.stoneSupport(L.stone, st.angle, n[0], n[1]);
      const hop = st.gy + n[1] * S.R - st.y;
      GW.stone(ctx, L.stone, st.gx + n[0] * sup, st.gy + n[1] * sup - hop, st.angle, { alpha: st.alpha });
    };
    const drawFig = () => GW.gentleman(ctx, Object.assign({ T, seed: 5, rim: 0.7 * C.open, rimDir: 1 }, A.pose));
    if (figFirst) { drawFig(); drawStone(); } else { drawStone(); drawFig(); }
    camera(ctx, t, 1.25);
    ctx.drawImage(L.low, -120, 0);
    // at the loop point the whole lower world swells a little, so the bank is part of the weather, not a lone cloud
    if (C.seam > 0.001) { ctx.globalAlpha = 0.55 * C.seam; ctx.drawImage(L.low, -120, -60 * C.seam); ctx.globalAlpha = 1; ctx.fillStyle = GW.paperRGBA(0.12 * C.seam); ctx.fillRect(-60, 0, W + 120, H); }
    // the bank: always faintly there; at the loop point it rises up the slope out of the lower world and lies over him
    camera(ctx, t, 1.1);
    { const k = C.seam, a = 0.14 + 0.86 * k; ctx.globalAlpha = a; ctx.drawImage(L.seam, -150 - 90 * (1 - k), -100 + 110 * (1 - k)); ctx.globalAlpha = 1; }
    // the ground in front
    camera(ctx, t, 1.8);
    ctx.drawImage(L.ground, -120, 0);
    // wisps drifting in front
    camera(ctx, t, 1.6);
    L.wisps.forEach((w, i) => {
      const ph = 2 * Math.PI * t / S.DUR + w.phase;
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(ph * 2); ctx.drawImage(w.c, w.x + 70 * Math.sin(ph), w.y + 6 * Math.sin(ph * 2));
    });
    ctx.globalAlpha = 1;
    camera(ctx, t, 2.4);
    ctx.drawImage(L.front, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    GW.tooth(ctx, T, 1);
    ctx.restore();
  }

  G.SisyphusScene = { build, draw, SUN };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>

// Sisyphus: a 16 s loop in grey watercolour, drawn entirely in code.
// He pushes the stone up, lets it go, looks out into the light, and walks back down.
// Same seed, same picture. Keys: space = pause, s = save PNG, r = new seed (new paper and washes).
// URL: ?t=11.8 shows one moment of the loop.
const params = { seed: 7, width: 1920, height: 1080 };

const cv = document.getElementById('art'), ctx = cv.getContext('2d');
cv.width = params.width; cv.height = params.height;
const still = new URLSearchParams(location.search).get('t');
let layers = null, paused = false, t0 = performance.now(), tp = 0;
function build() {
  layers = SisyphusScene.build(GW.textures(params.width, params.height, params.seed));
  console.log('seed', params.seed);
}
function frame() {
  const t = still != null ? +still : ((paused ? tp : performance.now()) - t0) / 1000 % SisyphusPlan.DUR;
  SisyphusScene.draw(ctx, t, layers);
  window.done = true;
  if (still == null) requestAnimationFrame(frame);
}
build(); frame();
addEventListener('keydown', (e) => {
  if (e.key === ' ') { if (paused) t0 += performance.now() - tp; else tp = performance.now(); paused = !paused; e.preventDefault(); }
  if (e.key === 's') { const a = document.createElement('a'); a.download = `sisyphus_s${params.seed}.png`; a.href = cv.toDataURL('image/png'); a.click(); }
  if (e.key === 'r') { params.seed = Math.floor(Math.random() * 1e6); build(); }
});

</script>
